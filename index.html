    .hdr-stat-l { font-size: .68rem; opacity: .6; text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; }

    .sb-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 6px 16px 4px; }
    .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; color: var(--text); text-decoration: none; font-size: .82rem; border-left: 3px solid transparent; transition: background .12s, border-color .12s; }
    .sb-item:hover { background: var(--bg); border-left-color: var(--primary); }
    .sb-time { font-size: .72rem; color: var(--muted); min-width: 52px; }
    .sb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sb-item.customer .sb-dot { background: var(--cust); }
    .sb-item.internal .sb-dot { background: var(--int); }
    .sb-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

    /* Main */

    .legend { display: flex; gap: 18px; font-size: .78rem; color: var(--muted); margin-bottom: 20px; }

    .legend-dot.internal { background: var(--int); }

    .card-info { flex: 1; min-width: 0; }

    .card-people { font-size: .77rem; color: var(--muted); }
    .badge { font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; }
    .card.customer .badge { background: var(--cust-bg); color: var(--cust); }
    .card.internal .badge { background: var(--int-bg); color: var(--int); }
    .card-body { padding: 18px 20px; }

    .summary li.sub-2 { padding-left: 48px; color: #64748b; }

    .summary p { font-size: .855rem; color: #334155; line-height: 1.55; margin: 4px 0; }

    .no-summary { text-align: center; padding: 22px; color: var(--muted); font-size: .85rem; font-style: italic; }

function md(text) {
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = text.split('\n');
  const out = [];
  let inList = false;
  function closeList() { if (inList) { out.push('</ul>'); inList = false; } }
  for (const line of lines) {
    if (/^### /.test(line)) {
      closeList(); out.push(`<h3>${inline(line.slice(4))}</h3>`);
    } else {
      const m = line.match(/^(\s*)(?:[-*]|\d+\.)\s+(.*)/);
      if (m) {
        const depth = Math.min(Math.floor(m[1].length / 4), 2);
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push(`<li${depth > 0 ? ` class="sub-${depth}"` : ''}>${inline(m[2])}</li>`);
      } else if (line.trim() === '') {
        closeList();
      } else {
        closeList();
        if (line.trim()) out.push(`<p>${inline(line)}</p>`);
      }
    }
  }
  closeList();
  return out.join('\n');
}
